<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>HoloWeb AR hit-test (WebGPU backend)</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      #info { position: absolute; top: 8px; width: 100%; text-align: center; font: 13px system-ui; color: #fff; text-shadow: 0 0 3px #000; }
    </style>
    <!-- In the app this is injected at document start; loading it first here does the same. -->
    <script src="../holoweb-polyfill.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <div id="info">HoloWeb &middot; WebGPURenderer (WebGPU backend, XRGPUBinding) &middot; tap to place</div>
    <script type="module">
      import * as THREE from 'three/webgpu';
      import { runARScene } from './ar-scene.js';

      // Default backend: WebGPU when navigator.gpu exists. 'webgpu' makes three.js use XRGPUBinding.
      const renderer = new THREE.WebGPURenderer({ antialias: true, alpha: true });
      runARScene({ renderer, sessionInit: { requiredFeatures: ['hit-test'], optionalFeatures: ['webgpu'] } });
    </script>
  </body>
</html>
